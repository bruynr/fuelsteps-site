# Builds the site (python build.py) and publishes it to GitHub Pages on every push to gh-pages.
name: Deploy site

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history: sitemap lastmod comes from git log
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pillow
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - run: python build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Ping IndexNow
        run: python build.py indexnow
        continue-on-error: true
